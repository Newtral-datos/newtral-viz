<head>

<style>
:root{--g:#01f3b3;--r:4px}
*{box-sizing:border-box}
body{margin:0;padding:24px 16px;background:#fff;color:#000;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;line-height:1.4}
.wrap{max-width:1200px;margin:0 auto}
h1{font-size:1.6rem;margin:0 0 20px;font-weight:700}
.filters{display:flex;flex-wrap:wrap;gap:12px}
.sel{position:relative;max-width:100%}
.sel select{width:100%;appearance:none;-webkit-appearance:none;background:#fff;color:#000;font:inherit;font-size:.95rem;padding:9px 34px 9px 10px;border:2px solid var(--g);border-radius:var(--r);cursor:pointer}
.sel select:focus{outline:none;box-shadow:0 0 0 3px rgba(1,243,179,.35)}
.sel::after{content:"";position:absolute;right:12px;top:50%;width:10px;height:10px;margin-top:-7px;border-right:2px solid #000;border-bottom:2px solid #000;transform:rotate(45deg) scale(.8);pointer-events:none}
#summary{margin:20px 0 24px;font-size:1.05rem;line-height:2}
.box{background:var(--g);border-radius:var(--r);padding:2px 8px;font-weight:700;white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{border:1px solid #ddd;border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;background:#fff;transition:transform .2s,box-shadow .2s,border-color .2s}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 20px rgba(0,0,0,.12);border-color:var(--g)}
.card h2{font-size:1rem;margin:0 0 6px;padding-bottom:10px;border-bottom:1px solid #ddd;font-weight:700;line-height:1.3}
.card h2 a{color:var(--g);text-decoration:none;font-family:'Segoe UI Symbol','Noto Sans Symbols 2',sans-serif;margin-left:4px}
.card h2 a:hover{color:#000}
.pres{font-size:1.1rem;font-weight:400}
.leg{color:#494949;font-size:.85rem}
.dates{font-size:.85rem;margin:6px 0 0 5px;padding-left:18px;border-left:2px solid var(--g);display:flex;flex-direction:column;gap:8px}
.dates div{position:relative}
.dates div::before{content:"";position:absolute;left:-18px;top:50%;width:10px;height:10px;background:#000;transform:translate(-50%,-50%)}
.dates b{font-weight:700}
.empty{grid-column:1/-1;color:#666}
@media(max-width:980px){.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.cards{grid-template-columns:1fr}.sel{width:100%!important}}
</style>
</head>

const COL = {"PSOE":"#e30613","PP":"#0a8fd8","Unidas Podemos":"#7b3f98"};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const parties = r => r.partido.split(' + ');
const partyLabel = v => v.includes(' + ') ? 'Coalición PSOE + UP' : v;
const roman = n => { let o='',v=[[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']]; for(const [k,s] of v) while(n>=k){o+=s;n-=k;} return o; };

const FILTERS = [
  {id:'fPartido', ph:'Partido',     vals:r => [r.partido],     label:partyLabel},
  {id:'fPres',    ph:'Presidente',  vals:r => [r.pres],        label:v => v},
  {id:'fLeg',     ph:'Legislatura', vals:r => [String(r.leg)], label:v => roman(+v), sort:(a,b)=>a-b},
];
const matchMom = (r,m) => m==='all' || (m==='post') === r.post;
const sel = () => ({fPartido:$('fPartido').value, fPres:$('fPres').value, fLeg:$('fLeg').value});
const matches = (r, s, skip) =>
  (skip==='fPartido' || !s.fPartido || r.partido===s.fPartido) &&
  (skip==='fPres'    || !s.fPres    || r.pres===s.fPres) &&
  (skip==='fLeg'     || !s.fLeg     || String(r.leg)===s.fLeg) &&
  matchMom(r, $('fMom').value);

// Rellena cada desplegable solo con valores compatibles con el resto de filtros
function refreshOptions(){
  let s = sel();
  FILTERS.forEach(f => {
    const vals = [...new Set(DATA.filter(r => matches(r,s,f.id)).flatMap(f.vals))];
    vals.sort(f.sort || undefined);
    if(s[f.id] && !vals.includes(s[f.id])) s[f.id] = '';
    $(f.id).innerHTML = `<option value="">${f.ph}</option>` + vals.map(v => `<option value="${esc(v)}">${esc(f.label(v))}</option>`).join('');
    $(f.id).value = s[f.id];
  });
}

  const ctx = document.createElement('canvas').getContext('2d');
  const all = {
    fPartido:['Partido',...new Set(DATA.map(r=>partyLabel(r.partido)))],
    fPres:['Presidente',...new Set(DATA.map(r=>r.pres))],
    fLeg:['Legislatura',...new Set(DATA.map(r=>roman(r.leg)))],
    fMom:[...$('fMom').options].map(o=>o.text),
  };
  for(const id in all){
    const el = $(id), cs = getComputedStyle(el);
    ctx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    const w = Math.max(...all[id].map(t => ctx.measureText(t).width));
    el.parentElement.style.width = Math.ceil(w + 10 + 34 + 4 + 4) + 'px';
  }
}

function partyHtml(r){
  const ps = parties(r), c = p => COL[p]||'#000';
  return `<span style="color:${c(ps[0])}">(</span>` +
    ps.map(p => `<span style="color:${c(p)}">${esc(p)}</span>`).join(' + ') +
    `<span style="color:${c(ps[ps.length-1])}">)</span>`;
}

const ts = d => { const [dd,mm,yy] = d.split('/'); return +(yy+mm+dd); };
const timeline = r => [[r.conv,'Convocatoria electoral'],[r.fecha,'RDL'],[ELEC[r.conv],'Elecciones']]
  .sort((a,b) => ts(a[0]) - ts(b[0]))
  .map(([d,t]) => `<div><b>${d}</b> - ${t}</div>`).join('');

function render(){
  const p=$('fPartido').value, pr=$('fPres').value, l=$('fLeg').value, m=$('fMom').value;
  const rows = DATA.filter(r => matches(r, {fPartido:p, fPres:pr, fLeg:l}));
  const n = rows.length;
  const box = t => `<span class="box">${esc(t)}</span>`;

  const bg = v => { const c = parties({partido:v}).map(x => COL[x]); return c.length>1 ? `linear-gradient(90deg,${c[0]} 50%,${c[1]} 50%)` : c[0]; };
  const pbox = v => `<span class="box" style="background:${bg(v)};color:#fff">${esc(partyLabel(v))}</span>`;
  let who = '';
  if(pr) who = box(pr);
  else if(p) who = (p.includes('+') ? 'La ' : 'El ') + pbox(p);
  const legTxt = l ? ` en la ${box('legislatura '+roman(+l))}` : '';
  const perfect = p==='PSOE' || pr==='Pedro Sánchez';
  const num = box(`${n} ${n===1?'decreto':'decretos'}`);
  const post = m==='post';
  let s;
  if(who){
    const verb = perfect ? 'ha presentado' : 'presentó';
    s = `${who} ${verb} ${num}` + (post ? ' tras la convocatoria de elecciones' : ' aprobados por la Diputación Permanente') + `${legTxt}.`;
  } else if(post){
    s = `Se ${n===1?'ha presentado':'han presentado'} ${num} tras la convocatoria de elecciones${legTxt}.`;
  } else {
    s = `Se ${n===1?'ha aprobado':'han aprobado'} ${num} por la Diputación Permanente${legTxt}.`;
  }
  $('summary').innerHTML = s;

  $('cards').innerHTML = n ? rows.map(r => `
    <article class="card">
      <h2>${esc(r.tit)}<a href="${esc(r.url)}" target="_blank" rel="noopener" title="Ver en el Congreso">🡭</a></h2>
      <div class="pres">${esc(r.pres)} ${partyHtml(r)}</div>
      <i class="leg">Legislatura ${roman(r.leg)}</i>
      <div class="dates">${timeline(r)}</div>
    </article>`).join('') : '<p class="empty">No hay decretos con esta combinación.</p>';
}
['fPartido','fPres','fLeg','fMom'].forEach(id => $(id).addEventListener('change', () => { refreshOptions(); render(); }));
refreshOptions(); sizeSelects(); render();
if(document.fonts) document.fonts.ready.then(sizeSelects);
</script>
</body>
</html>
