  .search-bar select {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    height: 38px; padding: 0 12px;
    border: 1.5px solid #01f3b3; border-radius: 3px;
    background: var(--color-background-primary);
    color: var(--color-text-primary); font-size: 14px; outline: none;
  }
  .search-bar select:focus { border-color: #00c994; }
  .btn-buscar {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    height: 38px; padding: 0 22px; background: #01f3b3;
    border: none; border-radius: 3px; font-size: 14px;
    font-weight: 500; color: #04342C; cursor: pointer;
  }
  .btn-buscar:hover { background: #00dba0; }
  .btn-limpiar {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    height: 38px; padding: 0 16px; background: transparent;
    border: 1.5px solid #01f3b3; border-radius: 3px; font-size: 14px;
    color: var(--color-text-secondary); cursor: pointer;
  }
  .btn-limpiar:hover { background: var(--color-background-secondary); }
  .results-count { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 1rem; }
  .card {
    border: 1.5px solid #01f3b3; border-radius: 3px;
    background: var(--color-background-primary);
    padding: 1rem 1.25rem; margin-bottom: 12px;
  }
  .card-keyword {
    display: inline-block; font-size: 11px; font-weight: 500;
    background: #01f3b3; color: #04342C; border-radius: 3px;
    padding: 2px 8px; margin-bottom: 8px; letter-spacing: 0.04em; text-transform: uppercase;
  }
  .card-title { font-size: 14px; font-weight: 500; color: var(--color-text-primary); line-height: 1.5; margin-bottom: 10px; }
  .card-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  
  /* --- Estilos base del Badge de Autor --- */

    font-size: 12px; font-weight: 500; padding: 3px 10px;
    border: 1.5px solid #494949; border-radius: 3px; color: #494949;
  }

  .badge-autor.pp { color: #1e4a90; background: #1e4a903d; border-color: #1e4a90; }

function estadoClass(e) {
  const s = e.toLowerCase();
  if (s.includes("retir")) return "retirado";
  if (s.includes("rechaz")) return "rechazado";
  if (s.includes("aprobad")) return "aprobado";
  if (s.includes("pleno") || s.includes("toma")) return "pleno";
  return "";
}

function autorClass(a) {
  const s = a.toLowerCase().trim();
  if (s === "psoe") return "psoe";
  if (s === "pp") return "pp";
  if (s === "vox") return "vox";
  if (s === "sumar") return "sumar";
  if (s === "erc") return "erc";
  if (s.includes("bildu")) return "eh-bildu";
  if (s === "pnv") return "pnv";
  if (s.includes("jxcat") || s.includes("junts")) return "jxcat";
  if (s === "podemos") return "podemos";
  if (s === "upn") return "upn";
  if (s === "bng") return "bng";
  if (s.includes("compromís") || s.includes("compromis")) return "mes-compromis";
  if (s.includes("cca")) return "cca";
  if (s === "senado-psoe") return "senado-psoe";
  if (s.includes("izquierdas por la independencia")) return "senado-izquierdas";
  return ""; 
}

function poblarDesplegables() {
  const palabras = [...new Set(DATA.map(d => d.palabra).filter(Boolean))].sort();
  const tipos = [...new Set(DATA.map(d => d.tipo).filter(Boolean))].sort();
  const autores = [...new Set(DATA.map(d => d.autor).filter(Boolean))].sort();
  
  const selKw = document.getElementById('inp-keyword');
  const selTipo = document.getElementById('inp-tipo-iniciativa');
  const selAut = document.getElementById('inp-autor');
  
  palabras.forEach(p => { const o = document.createElement('option'); o.value = p; o.textContent = p; selKw.appendChild(o); });
  tipos.forEach(t => { const o = document.createElement('option'); o.value = t; o.textContent = t; selTipo.appendChild(o); });
  autores.forEach(a => { const o = document.createElement('option'); o.value = a; o.textContent = a; selAut.appendChild(o); });
}

function renderCards(items) {
  const cont = document.getElementById('results');
  const count = document.getElementById('results-count');
  if (!items.length) {
    cont.innerHTML = '<div class="empty"><i class="ti ti-search" style="font-size:28px;display:block;margin-bottom:8px;opacity:0.3" aria-hidden="true"></i>No se encontraron iniciativas con esos filtros.</div>';
    count.textContent = '';
    return;
  }
  count.textContent = items.length === 1 ? '1 resultado' : items.length + ' resultados';
  cont.innerHTML = items.map(d => `
    <div class="card">
      <span class="card-keyword">${d.palabra}</span>
      <p class="card-title">${d.titulo}</p>
      <div class="card-meta">
        <span class="badge-autor ${autorClass(d.autor)}"><i class="ti ti-user" style="font-size:13px;vertical-align:-1px;margin-right:4px" aria-hidden="true"></i>${d.autor}</span>
        <span class="badge-estado ${estadoClass(d.estado)}"><i class="ti ti-circle-check" style="font-size:13px;vertical-align:-1px;margin-right:4px" aria-hidden="true"></i>Estado: ${d.estado}</span>
      </div>
      <div style="font-size:12px; margin-bottom:10px; color:var(--color-text-secondary)"><strong>Tipo:</strong> ${d.tipo}</div>
      <div class="card-link">
        <a href="${d.enlace}" target="_blank" rel="noopener">
          <i class="ti ti-external-link" style="font-size:13px" aria-hidden="true"></i>
          Ver iniciativa en el Congreso
        </a>
      </div>
    </div>
  `).join('');
}

function buscar() {
  const kw = document.getElementById('inp-keyword').value;
  const tipo = document.getElementById('inp-tipo-iniciativa').value;
  const autor = document.getElementById('inp-autor').value;
  
  const res = DATA.filter(d => {
    const matchKw = !kw || d.palabra.toLowerCase() === kw.toLowerCase();
    const matchTipo = !tipo || d.tipo.toLowerCase() === tipo.toLowerCase();
    const matchAutor = !autor || d.autor.toLowerCase() === autor.toLowerCase();
    return matchKw && matchTipo && matchAutor;
  });
  renderCards(res);
}

function limpiar() {
  document.getElementById('inp-keyword').selectedIndex = 0;
  document.getElementById('inp-tipo-iniciativa').selectedIndex = 0;
  document.getElementById('inp-autor').selectedIndex = 0;
  document.getElementById('results').innerHTML = '';
  document.getElementById('results-count').textContent = '';
}

poblarDesplegables();
</script>
