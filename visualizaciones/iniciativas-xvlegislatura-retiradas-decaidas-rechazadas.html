<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Iniciativas Parlamentarias</title>
<style>
  :root {
    --paper: #FFFFFF;
    --paper-dark: rgba(170,170,170,0.15);
    --ink: #494949;
    --ink-soft: #494949;
    --accent: #01F3B3;
    --line: #AAAAAA;
    --card-bg: #FFFFFF;
    --status-rechazado: #494949;
    --status-rechazado-bg: rgba(170,170,170,0.35);
    --status-decaido: #494949;
    --status-decaido-bg: rgba(170,170,170,0.35);
    --status-retirado: #494949;
    --status-retirado-bg: rgba(170,170,170,0.35);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 40px 28px 80px;
  }

  header {
    border-bottom: 3px solid var(--ink);
    padding-bottom: 22px;
    margin-bottom: 30px;
  }

  h1 {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 30px;
    font-weight: 700;
    margin: 0;
    line-height: 1.2;
    color: var(--ink);
  }

  .filters {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 20px 22px;
    margin-bottom: 28px;
    display: grid;
    grid-template-columns: 1.3fr 1fr 1fr;
    gap: 16px;
  }

  @media (max-width: 720px) {
    .filters { grid-template-columns: 1fr; }
  }

  .field label {
    display: block;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }

  .field input, .field select {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 3px;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 14px;
    color: var(--ink);
  }

  .field input:focus, .field select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(122,31,43,0.12);
  }

  .results-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 12.5px;
    color: var(--ink-soft);
  }

  .reset-btn {
    background: none;
    border: 1px solid var(--line);
    padding: 6px 12px;
    border-radius: 3px;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 12.5px;
    color: var(--ink);
    cursor: pointer;
  }
  .reset-btn:hover { background: var(--paper-dark); }

  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-left: 4px solid var(--ink);
    border-radius: 3px;
    padding: 16px 20px 15px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
  }

  .card.status-Rechazado { border-left-color: var(--status-rechazado); }
  .card.status-Decaido { border-left-color: var(--status-decaido); }
  .card.status-Retirado { border-left-color: var(--status-retirado); }

  .expediente {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 11.5px;
    color: var(--accent);
    letter-spacing: 0.03em;
    white-space: nowrap;
    font-weight: 600;
  }

  .status-badge {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 10.5px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 2px;
    font-weight: 500;
    white-space: nowrap;
    background: var(--status-rechazado-bg);
    color: var(--status-rechazado);
  }

  .card-title a {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 16.5px;
    line-height: 1.4;
    color: var(--ink);
    text-decoration: none;
    font-weight: 500;
  }

  .card-title a:hover {
    color: var(--accent);
    text-decoration: underline;
  }

  .type-label {
    font-size: 12px;
    color: var(--ink-soft);
    line-height: 1.3;
  }

  .card-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-top: 2px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
  }

  .author-tag {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 11.5px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 2px;
    white-space: nowrap;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 16px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Iniciativas retiradas, rechazadas o decaídas de la XV legislatura</h1>
  </header>

  <div class="filters">
    <div class="field">
      <label for="searchInput">Buscar por título o estado</label>
      <input type="text" id="searchInput" placeholder="Ej. vivienda, Rechazado...">
    </div>
    <div class="field">
      <label for="typeSelect">Tipo de iniciativa</label>
      <select id="typeSelect"><option value="">Todos los tipos</option></select>
    </div>
    <div class="field">
      <label for="partySelect">Grupo / autor</label>
      <select id="partySelect"><option value="">Todos los grupos</option></select>
    </div>
  </div>

  <div class="results-bar">
    <span id="resultsCount"></span>
    <button class="reset-btn" id="resetBtn">Borrar filtros</button>
  </div>

  <div class="grid" id="grid"></div>
</div>

const searchInput = document.getElementById('searchInput');
const typeSelect = document.getElementById('typeSelect');
const partySelect = document.getElementById('partySelect');
const grid = document.getElementById('grid');
const resultsCount = document.getElementById('resultsCount');
const resetBtn = document.getElementById('resetBtn');

function slugStatus(s) {
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

function populateSelect(el, values, allLabel) {
  values.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v;
    opt.textContent = v;
    el.appendChild(opt);
  });
}

const types = [...new Set(DATA.map(d => d.type))].sort();
const parties = [...new Set(DATA.map(d => d.author))].sort();
populateSelect(typeSelect, types);
populateSelect(partySelect, parties);

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

const PARTY_COLORS = [
  ['PSOE', '#f31912'],
  ['UPN', '#1e4a90'],
  ['PP', '#1e4a90'],
  ['VOX', '#66bc29'],
  ['SUMAR', '#e51c55'],
  ['ERC', '#FFB232'],
  ['BILDU', '#00c19f'],
  ['PNV', '#499e37'],
  ['JUNTS', '#00c3b2'],
  ['PODEMOS', '#9169f4'],
  ['BNG', '#6aade4'],
  ['MES COMPROMIS', '#e67727'],
  ['MÉS COMPROMÍS', '#e67727'],
  ['CCA', '#ffcb05'],
  ['CC', '#ffcb05']
];

function getPartyColor(author) {
  const upper = author.toUpperCase();
  for (const [key, color] of PARTY_COLORS) {
    if (upper.includes(key)) return color;
  }
  return '#AAAAAA';
}

function getContrastText(hex) {
  const c = hex.replace('#', '');
  const r = parseInt(c.substring(0,2), 16);
  const g = parseInt(c.substring(2,4), 16);
  const b = parseInt(c.substring(4,6), 16);
  const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  return luminance > 0.6 ? '#494949' : '#FFFFFF';
}

function render() {
  const q = searchInput.value.trim().toLowerCase();
  const type = typeSelect.value;
  const party = partySelect.value;

  const filtered = DATA.filter(d => {
    const matchesQuery = !q || d.title.toLowerCase().includes(q) || d.status.toLowerCase().includes(q);
    const matchesType = !type || d.type === type;
    const matchesParty = !party || d.author === party;
    return matchesQuery && matchesType && matchesParty;
  });

  resultsCount.textContent = filtered.length + ' de ' + DATA.length + ' iniciativas';

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty-state">No se han encontrado iniciativas con estos criterios.</div>';
    return;
  }

  grid.innerHTML = filtered.map(d => {
    const statusClass = 'status-' + slugStatus(d.status);
    const partyColor = getPartyColor(d.author);
    const partyText = getContrastText(partyColor);
    return `
    <div class="card ${statusClass}">
      <div class="card-top">
        <span class="expediente">Exp. ${escapeHtml(d.expediente)}</span>
        <span class="status-badge">${escapeHtml(d.status)}</span>
      </div>
      <div class="card-title">
        <a href="${d.url}" target="_blank" rel="noopener noreferrer">${escapeHtml(d.title)}</a>
      </div>
      <div class="card-bottom">
        <span class="type-label">${escapeHtml(d.type)}</span>
        <span class="author-tag" style="background:${partyColor};color:${partyText}">${escapeHtml(d.author)}</span>
      </div>
    </div>`;
  }).join('');
}

searchInput.addEventListener('input', render);
typeSelect.addEventListener('change', render);
partySelect.addEventListener('change', render);
resetBtn.addEventListener('click', () => {
  searchInput.value = '';
  typeSelect.value = '';
  partySelect.value = '';
  render();
});

render();
</script>
