<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cambios en las portavocías de cada grupo del Senado</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background: #ffffff;
    color: #000000;
    display: flex;
    justify-content: center;
    padding: 2rem 1rem;
  }

  #chart-container {
    width: 100%;
    max-width: 1000px;
  }

  h1 {
    font-size: 2rem;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 0.7rem;
    text-align: left;
  }

  /* Tooltip */
  .tooltip {
    position: fixed;
    pointer-events: none;
    background: #fff;
    border: 1px solid #e2e2e2;
    border-radius: 1px;
    padding: 11px 15px;
    font-size: 0.82rem;
    line-height: 1.55;
    opacity: 0;
    transition: opacity 0.13s;
    z-index: 100;
    max-width: 260px;
  }
  .tooltip .tt-name {
    font-weight: 700;
    font-size: 0.92rem;
    margin-bottom: 3px;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }

  .tooltip .tt-dates {
    font-size: 0.78rem;
    color: #555;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }
  .tooltip .tt-partido {
    font-size: 0.72rem;
    margin-top: 3px;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }

  svg text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }

  .bar {
    cursor: pointer;
    transition: filter 0.1s;
  }
  .bar:hover { filter: brightness(0.85); }
  
  .footer {
    margin-top: 10px;
    font-size: 0.85rem;
    color: #000;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }
  .source {
    margin-top: 5px;
    font-size: 0.9rem;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    color: #888; 
  }
</style>
</head>
<body>

<div id="chart-container">
  <h1>Cambios en las portavocías de cada grupo del Senado</h1>
  <svg id="chart"></svg>
  <div class="footer"><strong>*</strong>El portavoz de Junts, Josep Lluís Cleries, dejó el Senado en julio de 2024, sustituyéndole en el cargo Eduard Pujol.</div>
  <div class="source">Autor: Newtral.es · Fuente: Senado</div>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
// ── DATA DE SENADORES Y SUS FILAS ASIGNADAS ──
const senators = [
  { id: 'arenas', name: 'Francisco Javier Arenas Bocanegra', partido: 'PP', color: '#1d428a', row: 0 },
  { id: 'garcia', name: 'Alicia García Rodríguez', partido: 'PP', color: '#1d428a', row: 1 },
  { id: 'granados', name: 'Eva María Granados Galiano', partido: 'PSOE', color: '#ed1c24', row: 2 },
  { id: 'espadas', name: 'Juan Espadas Cejas', partido: 'PSOE', color: '#ed1c24', row: 3 },
  { id: 'bailac', name: 'Sara Bailac Ardanuy', partido: 'ERC', color: '#ffb232', row: 4 },
  { id: 'elejabarrieta', name: 'Gorka Elejabarrieta Díaz', partido: 'Bildu', color: '#00c399', row: 5 },
  
  // Grupo Plural: Junts ahora está desdoblado en dos filas individuales e independientes
  { id: 'cleries', name: 'Josep Lluís Cleries', partido: 'Junts', color: '#00c4b3', row: 6 },
  { id: 'pujol', name: 'Eduard Pujol', partido: 'Junts', color: '#00c4b3', row: 7 }, 
  { id: 'sangines', name: 'Pedro Manuel Sanginés', partido: 'CC', color: '#ffd700', row: 8 },
  { id: 'armas', name: 'Aniceto Javier Armas', partido: 'AHI', color: '#00a650', row: 9 },
  { id: 'silva', name: 'María Carmen da Silva', partido: 'BNG', color: '#7ebcff', row: 10 },
  
  { id: 'beltran', name: 'Estefanía Beltrán de Heredia Arroniz', partido: 'PNV', color: '#4b9e46', row: 11 },
  
  // Izquierda Confederal
  { id: 'delgado', name: 'Carla Delgado', partido: 'Más Madrid', color: '#5bc289', row: 12 },
  { id: 'ferrer', name: 'Juanjo Ferrer', partido: 'independiente', color: '#d9d9d9', row: 13 },
  { id: 'morera', name: 'Enric Xavier Morera', partido: 'Compromís', color: '#f37021', row: 14 },
  { id: 'chinea', name: 'Fabián Chinea Correa', partido: 'ASG', color: '#ba2025', row: 15 },
  { id: 'barcos', name: 'Miren Uxue Barcos', partido: 'Geroa BAI', color: '#e30613', row: 16 }
];

// Matriz de fechas actualizada (con Cleries y Pujol separados según su vigencia temporal)
const activeData = [
  ["2023-08-17", ["granados", "arenas", "beltran", "delgado", "cleries", "bailac"]],
  ["2023-09-01", ["granados", "arenas", "beltran", "delgado", "cleries", "bailac"]],
  ["2023-10-01", ["granados", "arenas", "beltran", "ferrer", "cleries", "bailac"]],
  ["2023-11-01", ["granados", "arenas", "beltran", "morera", "cleries", "bailac"]],
  ["2023-12-01", ["espadas", "garcia", "beltran", "chinea", "sangines", "bailac"]],
  ["2024-01-01", ["espadas", "garcia", "beltran", "barcos", "armas", "bailac"]],
  ["2024-02-01", ["espadas", "garcia", "beltran", "cleries", "delgado", "bailac"]],
  ["2024-03-01", ["espadas", "garcia", "beltran", "silva", "ferrer", "bailac"]],
  ["2024-04-01", ["espadas", "garcia", "beltran", "cleries", "morera", "bailac"]],
  ["2024-05-01", ["espadas", "garcia", "beltran", "chinea", "cleries", "bailac"]],
  ["2024-06-01", ["espadas", "garcia", "beltran", "barcos", "sangines", "bailac"]],
  ["2024-07-01", ["espadas", "garcia", "beltran", "armas", "delgado", "bailac"]],
  ["2024-08-01", ["espadas", "garcia", "beltran", "silva", "ferrer", "bailac"]],
  ["2024-09-01", ["espadas", "garcia", "beltran", "pujol", "morera", "bailac"]],
  ["2024-10-01", ["espadas", "garcia", "beltran", "pujol", "chinea", "bailac"]],
  ["2024-11-01", ["espadas", "garcia", "beltran", "elejabarrieta", "pujol", "barcos"]],
  ["2024-12-01", ["espadas", "garcia", "beltran", "elejabarrieta", "sangines", "delgado"]],
  ["2025-01-01", ["espadas", "garcia", "beltran", "elejabarrieta", "armas", "ferrer"]],
  ["2025-02-01", ["espadas", "garcia", "beltran", "elejabarrieta", "silva", "morera"]],
  ["2025-03-01", ["espadas", "garcia", "beltran", "elejabarrieta", "pujol", "chinea"]],
  ["2025-04-01", ["espadas", "garcia", "beltran", "elejabarrieta", "pujol", "barcos"]],
  ["2025-05-01", ["espadas", "garcia", "beltran", "elejabarrieta", "pujol", "delgado"]],
  ["2025-06-01", ["espadas", "garcia", "beltran", "elejabarrieta", "sangines", "ferrer"]],
  ["2025-07-01", ["espadas", "garcia", "beltran", "elejabarrieta", "armas", "morera"]],
  ["2025-08-01", ["espadas", "garcia", "beltran", "elejabarrieta", "silva", "chinea"]],
  ["2025-09-01", ["espadas", "garcia", "beltran", "elejabarrieta", "pujol", "barcos"]],
  ["2025-10-01", ["espadas", "garcia", "beltran", "elejabarrieta", "pujol", "delgado"]],
  ["2025-11-01", ["espadas", "garcia", "beltran", "elejabarrieta", "pujol", "ferrer"]],
  ["2025-12-01", ["espadas", "garcia", "beltran", "elejabarrieta", "sangines", "morera"]],
  ["2026-01-01", ["espadas", "garcia", "beltran", "elejabarrieta", "armas", "chinea"]],
  ["2026-02-01", ["espadas", "garcia", "beltran", "elejabarrieta", "silva", "barcos"]],
  ["2026-03-01", ["espadas", "garcia", "beltran", "elejabarrieta", "pujol", "delgado"]],
  ["2026-04-01", ["espadas", "garcia", "beltran", "elejabarrieta", "pujol", "ferrer"]],
  ["2026-05-01", ["espadas", "garcia", "beltran", "elejabarrieta", "pujol", "morera"]]
];

const slots = [];
const openSlots = {};

activeData.forEach((row, i) => {
  const dStart = new Date(row[0]);
  const nextDate = (i < activeData.length - 1) ? new Date(activeData[i+1][0]) : new Date(2026, 5, 1);
  const currentActive = new Set(row[1]);

  currentActive.forEach(id => {
     if (!openSlots[id]) {
         openSlots[id] = { person: id, start: dStart, end: nextDate };
     } else {
         openSlots[id].end = nextDate;
     }
  });

  Object.keys(openSlots).forEach(id => {
     if (!currentActive.has(id)) {
         slots.push(openSlots[id]);
         delete openSlots[id];
     }
  });
});
Object.values(openSlots).forEach(s => slots.push(s));

// ── CONFIGURACIÓN DE GRUPOS (ACTUALIZADO A 17 FILAS TOTALES) ──
const groups = [
  { name: 'PP', rows: [0, 1], color: '#1d428a' },
  { name: 'PSOE', rows: [2, 3], color: '#ed1c24' },
  { name: 'Izquierdas\npor la\nindependencia', rows: [4, 5] },
  { name: 'Plural', rows: [6, 7, 8, 9, 10] }, // Actualizado: Ahora incluye de la 6 a la 10
  { name: 'PNV', rows: [11], color: '#4b9e46' },
  { name: 'Izquierda\nConfederal', rows: [12, 13, 14, 15, 16] }
];

const margin = { top: 40, right: 60, bottom: 20, left: 180 };
const rowH = 18;
const groupGap = 22;
const totalW = 1000;
const w = totalW - margin.left - margin.right;

const rowYMap = {};
let currentY = 0;
groups.forEach(g => {
   g.minY = currentY;
   g.rows.forEach(r => {
       rowYMap[r] = currentY;
       currentY += rowH;
   });
   g.maxY = currentY;
   currentY += groupGap;
});
const chartH = currentY - groupGap;
const totalH = chartH + margin.top + margin.bottom;

const svg = d3.select('#chart')
  .attr('viewBox', `0 0 ${totalW} ${totalH}`)
  .attr('width', '100%');

const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

// Eje X
const xScale = d3.scaleTime()
  .domain([new Date(2023, 7, 1), new Date(2026, 5, 1)])
  .range([0, w]);

const ticks = [
  new Date(2023, 8, 1), 
  new Date(2024, 2, 1), 
  new Date(2024, 8, 1), 
  new Date(2025, 2, 1), 
  new Date(2025, 8, 1), 
  new Date(2026, 2, 1), 
];
const fmtAxis = d3.timeFormat('%-m/%Y');

ticks.forEach(t => {
  const tx = xScale(t);
  g.append('line')
    .attr('x1', tx).attr('x2', tx)
    .attr('y1', -5).attr('y2', chartH)
    .attr('stroke', '#c8c8c8').attr('stroke-dasharray', '2,3');
  g.append('text')
    .attr('x', tx).attr('y', -18)
    .attr('text-anchor', 'middle')
    .attr('font-size', 13).attr('fill', '#494949')
    .text(fmtAxis(t));
});

// Eje Y (Grupos políticos alineados como en el SVG)
groups.forEach(group => {
   const y1 = rowYMap[group.rows[0]];
   const y2 = rowYMap[group.rows[group.rows.length - 1]] + rowH;
   
   // Línea espina lateral
   g.append('line')
    .attr('x1', -15).attr('x2', -15)
    .attr('y1', y1).attr('y2', y2)
    .attr('stroke', group.color || '#222')
    .attr('stroke-width', 3);

   // Nombre del grupo
   const textY = (y1 + y2) / 2;
   const lines = group.name.split('\n');
   const textGroup = g.append('text')
    .attr('x', -10).attr('y', textY)
    .attr('text-anchor', 'end')
    .attr('dominant-baseline', 'central')
    .attr('font-size', 15)
    .attr('font-weight', 700)
    .attr('fill', group.color || '#000');
    
   lines.forEach((l, i) => {
      textGroup.append('tspan')
        .attr('x', -25)
        .attr('dy', i === 0 ? (lines.length > 1 ? `-${(lines.length-1)*0.5}em` : '0') : '1.1em')
        .text(l);
   });
});

// Tooltip helpers
const tooltip = d3.select('#tooltip');
const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function fmtDate(d) {
  const dia = String(d.getDate()).padStart(2, '0');
  const mes = String(d.getMonth() + 1).padStart(2, '0'); // Los meses en JS van de 0 a 11
  const anio = d.getFullYear();
  return `${dia}/${mes}/${anio}`;
}

// ── BARRAS DE LOS SENADORES ──
g.selectAll('.bar')
  .data(slots)
  .join('rect')
  .attr('class', 'bar')
  .attr('x', d => xScale(d.start))
  .attr('y', d => rowYMap[senators.find(s => s.id === d.person).row])
  .attr('width', d => Math.max(2, xScale(d.end) - xScale(d.start)))
  .attr('height', rowH)
  .attr('fill', d => senators.find(s => s.id === d.person).color)
  .on('mouseenter', function (ev, d) {
    const s = senators.find(pp => pp.id === d.person);
    tooltip.html(`
      <div class="tt-name">${s.name}</div>
      <div class="tt-dates">${fmtDate(d.start)} — ${fmtDate(d.end)}</div>
      <div class="tt-partido" style="color: ${s.color}; font-weight: 700;">${s.partido}</div>
    `).style('opacity', 1);
    pos(ev);
  })
  .on('mousemove', pos)
  .on('mouseleave', () => tooltip.style('opacity', 0));

function pos(ev) {
  const n = tooltip.node();
  let l = ev.clientX + 14, t = ev.clientY - n.offsetHeight / 2;
  if (l + n.offsetWidth > innerWidth - 10) l = ev.clientX - n.offsetWidth - 14;
  if (t < 4) t = 4;
  if (t + n.offsetHeight > innerHeight - 4) t = innerHeight - n.offsetHeight - 4;
  tooltip.style('left', l + 'px').style('top', t + 'px');
}

// ── ETIQUETAS DE LOS PARTIDOS Y ASTERISCO ──
const partyLabels = {
   bailac: { text: 'ERC', align: 'right', color: '#ffb232' },
   elejabarrieta: { text: 'Bildu', align: 'left', color: '#00c399' },
}

Object.keys(partyLabels).forEach(pid => {
   const p = partyLabels[pid];
   const slot = slots.find(s => s.person === pid);
   
   if (slot) {
       const xStart = xScale(slot.start);
       const xEnd = xScale(slot.end);
       const y = rowYMap[senators.find(s => s.id === pid).row] + rowH/2;

       const t = g.append('text')
         .attr('y', y + (p.dy || 0))
         .attr('font-size', 13)
         .attr('fill', p.color)
         .attr('dominant-baseline', 'central');

       if (p.align === 'left') {
           t.attr('x', xStart + (p.dx || -5)).attr('text-anchor', 'end');
       } else {
           t.attr('x', xEnd + (p.dx || 5)).attr('text-anchor', 'start');
       }

       const lines = p.text.split('\n');
       lines.forEach((l, i) => {
           t.append('tspan')
            .attr('x', t.attr('x'))
            .attr('dy', i === 0 ? (lines.length > 1 ? '-0.4em' : '0') : '1.1em')
            .text(l);
       });
   }
});

// Asterisco sobre el final de Josep Lluís Cleries (Junts) en Julio de 2024
const cleriesLastSlot = slots.filter(s => s.person === 'cleries').pop();
if (cleriesLastSlot) {
  g.append('text')
    .attr('x', xScale(cleriesLastSlot.end) + 4)
    .attr('y', rowYMap[6] + rowH/2 + 5)
    .attr('font-size', 23)
    .attr('font-weight', 'bold')
    .attr('fill', '#000')
    .text('*');
}




</script>
</body>
</html>
