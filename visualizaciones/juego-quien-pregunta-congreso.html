// --- NORMAL LEVELS ---

function startLevel(id) {
  isCountdown = false;
  const original = LEVELS.find(l => l.id === id);
  currentLevel = {
    ...original,
    questions: balancedPick(original.questions, original.parties, 10)
  };
  currentQ = 0;
  lives = 3;
  score = 0;
  answered = false;
  showQuestion();
}

function balancedPick(allQuestions, parties, total) {
  const maxPerParty = Math.ceil(total / parties.length) + 1;
  const minPerParty = Math.max(1, Math.floor(total / parties.length) - 1);

  const byParty = {};
  parties.forEach(p => byParty[p] = []);
  allQuestions.forEach(q => {
    if (byParty[q.party]) byParty[q.party].push({...q});
  });

  parties.forEach(p => byParty[p] = shuffle([...byParty[p]]));

  let picked = [];
  parties.forEach(p => {
    const take = Math.min(minPerParty, byParty[p].length);
    for (let i = 0; i < take; i++) picked.push(byParty[p][i]);
    byParty[p] = byParty[p].slice(take);
  });

  const remaining = [];
  parties.forEach(p => remaining.push(...byParty[p]));
  shuffle(remaining);

  const count = {};
  picked.forEach(q => count[q.party] = (count[q.party] || 0) + 1);

  for (const q of remaining) {
    if (picked.length >= total) break;
    if ((count[q.party] || 0) < maxPerParty) {
      picked.push(q);
      count[q.party] = (count[q.party] || 0) + 1;
    }
  }

  return shuffle(picked);
}

function showQuestion() {
  if (lives <= 0) return showResult(false);
  if (currentQ >= currentLevel.questions.length) return showResult(true);

  answered = false;
  const q = currentLevel.questions[currentQ];
  const partyButtons = currentLevel.parties.map(pid => {
    const p = PARTIES[pid];
    return '<button class="party-btn" data-party="' + pid + '" onclick="answer(\'' + pid + '\')" style="border-color:' + p.color + '; background:' + p.color + '">' + p.name + '</button>';
  }).join('');

  render(
    '<div class="fade-in">' +
      '<div class="hud">' +
        '<div class="lives">' + [0,1,2].map(i => '<div class="life ' + (i >= lives ? 'lost' : '') + '">' + HEART_SVG + '</div>').join('') + '</div>' +
        '<div class="progress-text">' + (currentQ + 1) + ' / ' + currentLevel.questions.length + '</div>' +
      '</div>' +
      '<div class="question-box">' +
        '<span class="quote-open">\u201C</span>' +
        '<p>' + q.text + '</p>' +
        '<span class="quote-close">\u201D</span>' +
      '</div>' +
      '<div class="options">' + partyButtons + '</div>' +
      '<div class="feedback" id="feedback"></div>' +
      '<div class="author-info" id="author-info"></div>' +
      '<button class="menu-btn" onclick="goToMenu()">\u2190 Men\u00FA</button>' +
    '</div>'
  );
}

function answer(pid) {
  if (answered) return;
  answered = true;

  const q = currentLevel.questions[currentQ];
  const correct = pid === q.party;
  const buttons = document.querySelectorAll('.party-btn');
  const fb = document.getElementById('feedback');
  const authorEl = document.getElementById('author-info');

  buttons.forEach(btn => {
    const bpid = btn.dataset.party;
    btn.classList.add('disabled');
    if (bpid === q.party) btn.classList.add(correct ? 'correct' : 'reveal');
    if (bpid === pid && !correct) btn.classList.add('wrong');
  });

  if (correct) {
    score++;
    fb.className = 'feedback ok';
    fb.textContent = '\u2713 \u00A1Correcto!';
  } else {
    lives--;
    document.querySelectorAll('.life').forEach((el, i) => {
      if (i >= lives) el.classList.add('lost');
    });
    fb.className = 'feedback fail';
    fb.textContent = '\u2717 Era ' + PARTIES[q.party].name;
  }

  authorEl.textContent = '\u2014 ' + q.author;

  setTimeout(() => { currentQ++; showQuestion(); }, 1800);
}

function showResult(won) {
  const emoji = won ? '\uD83C\uDF89' : '\uD83D\uDC80';
  const title = won ? '\u00A1Nivel superado!' : 'Has perdido';
  const levelId = currentLevel.id;
  const msg = won
    ? 'Has acertado ' + score + ' de ' + currentLevel.questions.length + ' preguntas.'
    : 'Te has quedado sin vidas. Acertaste ' + score + '.';

  render(
    '<div class="result fade-in">' +
      '<div class="emoji">' + emoji + '</div>' +
      '<h2>' + title + '</h2>' +
      '<p>' + msg + '</p>' +
      '<div style="display:flex; gap:1px; justify-content:center;">' +
        '<button class="menu-btn" style="display:inline-block; margin:0;" onclick="startLevel(' + levelId + ')">↻ Reintentar</button>' +
        '<button class="menu-btn" style="display:inline-block; margin:0;" onclick="showMenu()">\u2190 Menú</button>' +
      '</div>' +
    '</div>'
  );
}

// --- COUNTDOWN MODE ---

function startCountdown() {
  isCountdown = true;
  currentLevel = null;
  countdownQuestions = shuffle([...COUNTDOWN_QUESTIONS]);
  currentQ = 0;
  score = 0;
  fails = 0;
  answered = false;
  timeLeft = 60;
  showCountdownQuestion();
  clearCountdown();
  countdownTimer = setInterval(() => {
    timeLeft--;
    updateTimerDisplay();
    if (timeLeft <= 0) { clearCountdown(); showCountdownResult(); }
  }, 1000);
}

function updateTimerDisplay() {
  const barInner = document.querySelector('.timer-bar-inner');
  const timerText = document.querySelector('.timer-text');
  if (barInner) {
    barInner.style.width = ((timeLeft / 60) * 100) + '%';
    barInner.classList.toggle('urgent', timeLeft <= 10);
  }
  if (timerText) {
    timerText.textContent = timeLeft + 's';
    timerText.classList.toggle('urgent', timeLeft <= 10);
  }
}

function showCountdownQuestion() {
  if (currentQ >= countdownQuestions.length) { clearCountdown(); return showCountdownResult(); }

  answered = false;
  const q = countdownQuestions[currentQ];
  const partyButtons = COUNTDOWN_PARTIES.map(pid => {
    const p = PARTIES[pid];
    return '<button class="party-btn" data-party="' + pid + '" onclick="answerCountdown(\'' + pid + '\')" style="border-color:' + p.color + '; background:' + p.color + '">' + p.name + '</button>';
  }).join('');

  const pct = (timeLeft / 60) * 100;
  const urg = timeLeft <= 10 ? ' urgent' : '';

  render(
    '<div class="fade-in">' +
      '<div class="timer-text' + urg + '">' + timeLeft + 's</div>' +
      '<div class="timer-bar"><div class="timer-bar-inner' + urg + '" style="width:' + pct + '%"></div></div>' +
      '<div class="hud">' +
        '<div class="progress-text" style="color:var(--primary); font-size:1.1rem;">\u2713 ' + score + '</div>' +
        '<div class="progress-text" style="color:#ff4d4d; font-size:1.1rem;">\u2717 ' + fails + '</div>' +
      '</div>' +
      '<div class="question-box">' +
        '<span class="quote-open">\u201C</span>' +
        '<p>' + q.text + '</p>' +
        '<span class="quote-close">\u201D</span>' +
      '</div>' +
      '<div class="options">' + partyButtons + '</div>' +
      '<div class="feedback" id="feedback"></div>' +
      '<div class="author-info" id="author-info"></div>' +
      '<button class="menu-btn" onclick="goToMenu()">\u2190 Men\u00FA</button>' +
    '</div>'
  );
}

function answerCountdown(pid) {
  if (answered) return;

  const q = countdownQuestions[currentQ];
  const correct = pid === q.party;
  const buttons = document.querySelectorAll('.party-btn');
  const fb = document.getElementById('feedback');
  const authorEl = document.getElementById('author-info');

  buttons.forEach(btn => {
    const bpid = btn.dataset.party;
    btn.classList.add('disabled');
    if (bpid === q.party) btn.classList.add(correct ? 'correct' : 'reveal');
    if (bpid === pid && !correct) btn.classList.add('wrong');
  });

  if (correct) {
    score++;

    fb.textContent = '\u2713 \u00A1Correcto!';
  } else {

  setTimeout(() => { currentQ++; if (timeLeft > 0) showCountdownQuestion(); }, 1200);

async function shareImage() {
  const btn = document.getElementById('btn-share');
  btn.textContent = 'Generando...';
  btn.disabled = true;

  try {
    const card = document.getElementById('share-card');

    const watermark = document.createElement('p');
    watermark.innerHTML = 'Un juego de <b style="color:#01f3b3">Newtral.es</b>';
    watermark.style.cssText = 'font-size:1.2rem; color:#000; margin-top:14px; margin-bottom:0;';
    card.appendChild(watermark);

    const canvas = await html2canvas(card, {
      backgroundColor: '#ffffff',
      scale: 2,
    });

    card.removeChild(watermark);

    if (navigator.canShare) {
      canvas.toBlob(async (blob) => {
        const file = new File([blob], 'resultado.png', { type: 'image/png' });
        if (navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              text: getShareText(),
              files: [file],
            });
            btn.textContent = '\uD83D\uDCF7 Compartir imagen';
            btn.disabled = false;
            return;
          } catch (e) {}
        }
        downloadCanvas(canvas);
        btn.textContent = '\u2713 Imagen descargada';
        btn.disabled = false;
        setTimeout(() => { btn.textContent = '\uD83D\uDCF7 Compartir imagen'; }, 2000);
      }, 'image/png');
    } else {
      downloadCanvas(canvas);
      btn.textContent = '\u2713 Imagen descargada';
      btn.disabled = false;
      setTimeout(() => { btn.textContent = '\uD83D\uDCF7 Compartir imagen'; }, 2000);
    }
  } catch (e) {
    btn.textContent = '\uD83D\uDCF7 Compartir imagen';
    btn.disabled = false;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(getShareText());
      btn.textContent = '\u2713 Texto copiado';
      setTimeout(() => { btn.textContent = '\uD83D\uDCF7 Compartir imagen'; }, 2000);
    }
  }
}

async function shareInstagram() {
  const btn = event.target;
  btn.textContent = 'Generando...';
  btn.disabled = true;

  try {
    const canvas = document.createElement('canvas');
    canvas.width = 1080;
    canvas.height = 1920;
    const ctx = canvas.getContext('2d');

    // Cargar imagen de fondo
    const bg = new Image();
    bg.crossOrigin = 'anonymous';
    bg.src = 'files/story-bg.png';

    await new Promise((resolve, reject) => {
      bg.onload = resolve;
      bg.onerror = reject;
    });

    // Dibujar imagen de fondo
    ctx.drawImage(bg, 0, 0, 1080, 1920);

    // Recuadro de resultado en la parte inferior
    const boxX = 60;
    const boxY = 75;
    const boxW = 960;
    const boxH = 340;
    const radius = 3;

    // Fondo del recuadro (blanco semitransparente)
    ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
    ctx.beginPath();
    ctx.roundRect(boxX, boxY, boxW, boxH, radius);
    ctx.fill();

    // Borde del recuadro
    ctx.strokeStyle = '#01f3b3';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.roundRect(boxX, boxY, boxW, boxH, radius);
    ctx.stroke();

    // Texto: título
    ctx.fillStyle = '#000000';
    ctx.font = 'bold 48px Helvetica Neue, Helvetica, Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('¿Quién pregunta qué en el Congreso?', 540, boxY + 65);

    // Texto: aciertos
    ctx.font = 'bold 56px Helvetica Neue, Helvetica, Arial, sans-serif';
    ctx.fillStyle = '#01f3b3';
    ctx.fillText('\u2713 ' + score, 440, boxY + 160);

    // Texto: fallos
    ctx.fillStyle = '#ff4d4d';
    ctx.fillText('\u2717 ' + fails, 640, boxY + 160);

    // Texto: pie
    ctx.font = '45px Helvetica Neue, Helvetica, Arial, sans-serif';
    ctx.fillStyle = '#494949';
    ctx.fillText('\u00BFPuedes superarme?', 540, boxY + 230);

    // Texto: crédito
    ctx.font = '40px Helvetica Neue, Helvetica, Arial, sans-serif';
    ctx.fillStyle = '#bbbbbb';
    ctx.fillText('Un juego de ', 420, boxY + 290);

    ctx.font = 'bold 44px Helvetica Neue, Helvetica, Arial, sans-serif';
    ctx.fillStyle = '#01f3b3';
    ctx.fillText('Newtral.es', 650, boxY + 290);

    // Descargar
    const link = document.createElement('a');
    link.download = 'resultado-story.png';
    link.href = canvas.toDataURL('image/png');
    link.click();

    btn.textContent = '\u2713 Imagen guardada';
    btn.disabled = false;
    setTimeout(() => { btn.textContent = '\uD83D\uDCF8 Instagram'; }, 3000);

    alert('Imagen guardada. \u00C1brela en Instagram y comp\u00E1rtela en tus Stories.');

  } catch (e) {
    btn.textContent = '\uD83D\uDCF8 Instagram';
    btn.disabled = false;
    alert('Error al compartir por Instagram.');
  }
}


function downloadCanvas(canvas) {
  const link = document.createElement('a');
  link.download = 'resultado-quien-lo-dijo.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
