<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador — Intervenciones en el Congreso</title>
  <style>
    :root {
      --bg: #fff;
      --surface: #fff;
      --border: #d8d8d8;
      --ink: #1A1A1A;
      --ink-muted: #494949;
      --accent: #01f3b3;
      --accent-dark: #01f3b3;
      --accent-light: #e6fdf8;
      --mono: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      min-height: 100vh;
    }

    header {
      background: #fff;
      padding: 1rem 2.5rem;
      border-bottom: 2px solid var(--accent);
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    header h1 {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 1rem;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: 0.01em;
    }

    .search-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1.25rem 2.5rem;
      display: flex;
      gap: 1rem;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .search-bar label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-muted);
      white-space: nowrap;
    }

    .search-bar input {
      flex: 1;
      border: 1.5px solid var(--border);
      border-radius: 2px;
      padding: 0.6rem 0.9rem;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 0.95rem;
      color: var(--ink);
      background: var(--bg);
      transition: border-color 0.2s;
      outline: none;
    }

    .search-bar input:focus {
      border-color: var(--accent);
      background: #fff;
    }

    .search-bar input::placeholder { color: #aaa; }

    .count-bar {
      padding: 0.75rem 2.5rem;
      font-size: 0.78rem;
      color: var(--ink-muted);
      font-family: var(--mono);
      border-bottom: 1px solid var(--border);
    }

    .results {
      padding: 1.5rem 2.5rem 3rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 1.25rem 1.5rem;
      transition: box-shadow 0.15s;
    }

    .card:hover {
      box-shadow: 0 3px 14px rgba(27,58,107,0.1);
    }

    .card-header {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-bottom: 0.75rem;
    }

    .card-name {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--ink);
    }

    .card-sep {
      color: var(--border);
      font-size: 1rem;
    }

    .card-cargo {
      font-size: 0.85rem;
      color: var(--ink-muted);
      font-weight: 500;
    }

    .card-segundos {
      margin-left: auto;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 0.82rem;
      background: var(--accent-light);
      color: #007a5a;
      border: 1px solid var(--accent);
      border-radius: 2px;
      padding: 0.2rem 0.55rem;
      white-space: nowrap;
    }

    .card-iniciativas {
      padding-top: 0.6rem;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .card-iniciativas-label {
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-muted);
      font-weight: 600;
      margin-bottom: 0.2rem;
    }

    .card-iniciativas a {
      font-size: 0.88rem;
      color: #007a5a;
      text-decoration: none;
      line-height: 1.4;
      border-bottom: 1px solid transparent;
      transition: border-color 0.15s, color 0.15s;
    }

    .card-iniciativas a:hover {
      border-bottom-color: var(--accent);
      color: #01f3b3;
    }

    .no-results {
      text-align: center;
      padding: 3rem;
      color: var(--ink-muted);
      font-size: 0.95rem;
    }

    mark {
      background: #ffe58a;
      border-radius: 2px;
      padding: 0 2px;
    }

    @media (max-width: 640px) {
      header, .search-bar, .count-bar, .results { padding-left: 1rem; padding-right: 1rem; }
      .search-bar { flex-wrap: wrap; }
      .card-segundos { margin-left: 0; }
    }
  </style>

function normalize(str) {
  return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function highlight(text, query) {
  if (!query) return escapeHtml(text);
  const escaped = escapeHtml(text);
  const q = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return escaped.replace(new RegExp(q, 'gi'), m => `<mark>${m}</mark>`);
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function render(query) {
  const q = normalize(query.trim());
  const filtered = q
    ? DATA.filter(p => normalize(p.nombre).includes(q) || normalize(p.cargo).includes(q))
    : DATA;

  const countEl = document.getElementById('count');
  countEl.textContent = q
    ? `${filtered.length} resultado${filtered.length !== 1 ? 's' : ''} para "${query.trim()}"`
    : '';

  const container = document.getElementById('results');

  if (filtered.length === 0) {
    container.innerHTML = `<div class="no-results">No se encontraron resultados para <strong>${escapeHtml(query)}</strong></div>`;
    return;
  }

  container.innerHTML = filtered.map(p => `
    <div class="card">
      <div class="card-header">
        <span class="card-name">${highlight(p.nombre, query.trim())}</span>
        <span class="card-sep">—</span>
        <span class="card-cargo">${highlight(p.cargo, query.trim())}</span>
        <span class="card-segundos">${p.segundos} s.</span>
      </div>
      <div class="card-iniciativas">
        <div class="card-iniciativas-label">Iniciativas</div>
        ${p.iniciativas.map(i => `<a href="${i.url}" target="_blank" rel="nofollow noopener">${escapeHtml(i.texto)}</a>`).join('')}
      </div>
    </div>
  `).join('');
}

document.getElementById('q').addEventListener('input', e => render(e.target.value));
render('');
