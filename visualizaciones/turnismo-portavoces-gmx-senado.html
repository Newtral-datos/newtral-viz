<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portavoces del Grupo Mixto del Senado</title>
<script src="https://pym.nprapps.org/pym.v1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    color: #1a1a1a;
    display: flex;
    justify-content: center;
    padding: 2rem 1rem;
  }

  #chart-container {
    width: 100%;
    max-width: 1000px;
    overflow: visible;
  }

  h1 {
    font-size: clamp(1.2rem, 4vw, 1.5rem); /* Escala de forma fluida */
    font-weight: 700;
    line-height: 1.4;
    margin-bottom: 0.2rem;
  }
  h1 .portavoz { 
    background-color: #01f3b3; 
    padding: 2px 8px;
    border-radius: 1px;
    display: inline-block;
  }

  h1 .adjunto { 
    background-color: #d8d8d8; 
    padding: 2px 8px;
    border-radius: 1px;
    display: inline-block;
  }

  .subtitle {
    font-size: clamp(0.95rem, 2.5vw, 1.07rem);
    color: #4a4a4a;
    margin-bottom: 1.5rem;
    line-height: 1.45;
  }

  .source {
    font-size: clamp(0.75rem, 2vw, 0.9rem);
    color: #999;
    margin-top: 0.6rem;
  }
  .source a { color: #888; }

  /* Aseguramos que el SVG sea fluido */
  #chart {
    display: block;
    width: 100%;
    height: auto;
  }

  /* Tooltip */
  .tooltip {
    position: fixed;
    pointer-events: none;
    background: #fff;
    border: 1px solid #e2e2e2;
    border-radius: 1px;
    padding: 11px 15px;
    font-size: 0.82rem;
    line-height: 1.55;
    opacity: 0;
    transition: opacity 0.13s;
    z-index: 100;
    max-width: 260px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }
  .tooltip .tt-name {
    font-weight: 700;
    font-size: 0.92rem;
    margin-bottom: 3px;
  }
  .tooltip .tt-badge {
    display: inline-block;
    padding: 1px 2px;
    border-radius: 1px;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin-bottom: 5px;
  }
  .tooltip .tt-badge.portavoz { background: #01f3b3; color: #0a4a35; }
  .tooltip .tt-badge.adjunto { background: #d8d8d8; color: #444; }
  .tooltip .tt-dates { font-size: 0.78rem; color: #555; }
  .tooltip .tt-partido { font-size: 0.72rem; margin-top: 3px; }

  svg text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }

  .bar {
    cursor: pointer;
    transition: filter 0.1s, opacity 0.1s;
  }
  .bar:hover { filter: brightness(0.85); }

  @media (max-width: 600px) {
    body { padding: 1rem 0.5rem; }
  }
</style>
</head>
<body>

<div id="chart-container">
  <h1>Los miembros del Grupo Mixto del Senado se turnan el <span class="portavoz">portavoz</span> y <span class="adjunto">portavoz adjunto</span></h1>
  <p class="subtitle">El expopular José Ignacio Landaluce nunca ha tenido un cargo en la portavocía en el grupo</p>
  <svg id="chart"></svg>
  <p class="source">Autor: Newtral.es · Fuente: Senado</p>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
// ── DATA ──
const people = [
  { id: 'alonso',    name: 'Javier\nValentín\nAlonso', fullName: 'Javier Valentín Alonso', partido: 'Vox', group: 'vox' },
  { id: 'gordillo',  name: 'Ángel\nGordillo',         fullName: 'Ángel Gordillo',         partido: 'Vox', group: 'vox' },
  { id: 'carbonell', name: 'Fernando\nCarbonell',     fullName: 'Fernando Carbonell',     partido: 'Vox', group: 'vox' },
  { id: 'paloma',    name: 'Paloma\nGómez',            fullName: 'Paloma Gómez',           partido: 'Vox', group: 'vox' },
  { id: 'caballero', name: 'María Mar\nCaballero',     fullName: 'María Mar Caballero',    partido: 'UPN', group: 'upn' },
  { id: 'landaluce', name: 'José\nIgnacio\nLandaluce',  fullName: 'José Ignacio Landaluce', partido: 'exPP', group: 'expp' },
];

const rawData = [
  { d: new Date(2023, 8, 19), v: [1, 2, 0, 0, 0] },
  { d: new Date(2023, 10, 1), v: [0, 1, 2, 0, 0] },
  { d: new Date(2023, 11, 1), v: [0, 0, 1, 2, 0] },
  { d: new Date(2024, 0, 1),  v: [2, 0, 0, 1, 0] },
  { d: new Date(2024, 1, 1),  v: [1, 2, 0, 0, 0] },
  { d: new Date(2024, 2, 1),  v: [0, 1, 2, 0, 0] },
  { d: new Date(2024, 3, 1),  v: [0, 0, 1, 2, 0] },
  { d: new Date(2024, 4, 1),  v: [2, 0, 0, 1, 0] },
  { d: new Date(2024, 5, 1),  v: [1, 2, 0, 0, 0] },
  { d: new Date(2024, 6, 1),  v: [0, 1, 2, 0, 0] },
  { d: new Date(2024, 7, 1),  v: [0, 0, 1, 2, 0] },
  { d: new Date(2024, 8, 1),  v: [2, 0, 0, 1, 0] },
  { d: new Date(2024, 9, 1),  v: [1, 2, 0, 0, 0] },
  { d: new Date(2024, 10, 1), v: [0, 1, 2, 0, 0] },
  { d: new Date(2024, 11, 1), v: [0, 0, 1, 2, 0] },
  { d: new Date(2025, 0, 1),  v: [2, 0, 0, 1, 0] },
  { d: new Date(2025, 1, 1),  v: [1, 2, 0, 0, 0] },
  { d: new Date(2025, 2, 1),  v: [0, 1, 2, 0, 0] },
  { d: new Date(2025, 3, 1),  v: [0, 0, 1, 2, 0] },
  { d: new Date(2025, 4, 1),  v: [2, 0, 0, 1, 0] },
  { d: new Date(2025, 5, 1),  v: [1, 2, 0, 0, 0] },
  { d: new Date(2025, 6, 1),  v: [0, 1, 2, 0, 0] },
  { d: new Date(2025, 7, 1),  v: [0, 0, 1, 2, 0] },
  { d: new Date(2025, 8, 1),  v: [2, 0, 0, 1, 0] },
  { d: new Date(2025, 9, 1),  v: [1, 2, 0, 0, 0] },
  { d: new Date(2025, 10, 1), v: [0, 1, 2, 0, 0] },
  { d: new Date(2025, 11, 1), v: [0, 0, 1, 2, 0] },
  { d: new Date(2026, 0, 1),  v: [2, 0, 0, 1, 0] },
  { d: new Date(2026, 1, 1),  v: [1, 2, 0, 0, 0] },
  { d: new Date(2026, 2, 1),  v: [0, 1, 0, 2, 0] },
  { d: new Date(2026, 3, 1),  v: [2, 0, 0, 1, 0] },
  { d: new Date(2026, 4, 1),  v: [1, 2, 0, 0, 0] }
];

const slots = [];
const cols = ['paloma', 'caballero', 'gordillo', 'carbonell', 'landaluce'];

for (let i = 0; i < rawData.length; i++) {
  const start = rawData[i].d;
  const end = (i < rawData.length - 1) ? rawData[i+1].d : new Date(2026, 5, 1);
  
  cols.forEach((personId, idx) => {
    const val = rawData[i].v[idx];
    if (val === 1) {
      slots.push({ person: personId, role: 'Portavoz', start: start, end: end });
    } else if (val === 2) {
      slots.push({ person: personId, role: 'Portavoz adjunto', start: start, end: end });
    }
  });
}

// ── CÁLCULOS DINÁMICOS DE PANTALLA ──
const isMobile = window.innerWidth < 600;
const margin = { top: 28, right: isMobile ? 15 : 25, bottom: 36, left: isMobile ? 90 : 200 };

const rowH = 30;
const rowGap = 14;
const numRows = people.length;
const chartH = numRows * rowH + (numRows - 1) * rowGap;

// Ajuste del ancho general: si es móvil toma el ancho de la ventana, si no 960px
const totalW = isMobile ? window.innerWidth - 15 : 960;
const w = totalW - margin.left - margin.right;
const totalH = chartH + margin.top + margin.bottom;

const svg = d3.select('#chart')
  .attr('viewBox', `0 0 ${totalW} ${totalH}`)
  .attr('width', '100%');

const defs = svg.append('defs');
const pat = defs.append('pattern')
  .attr('id', 'stripes')
  .attr('width', 5).attr('height', 5)
  .attr('patternUnits', 'userSpaceOnUse')
  .attr('patternTransform', 'rotate(33)');
pat.append('rect').attr('width', 5).attr('height', 5).attr('fill', '#fff');
pat.append('line').attr('x1', 0).attr('y1', 0).attr('x2', 0).attr('y2', 5)
  .attr('stroke', '#ccc').attr('stroke-width', 2);

const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

const xScale = d3.scaleTime()
  .domain([new Date(2023, 8, 1), new Date(2026, 5, 1)])
  .range([0, w]);

function rowY(i) { return i * (rowH + rowGap); }

// En móvil reducimos los ticks a 3 (uno por año) para no solapar los textos
const ticks = isMobile ? [
  new Date(2023, 10, 1), 
  new Date(2024, 10, 1), 
  new Date(2025, 10, 1)
] : [
  new Date(2023, 10, 1), 
  new Date(2024, 4, 1),  
  new Date(2024, 10, 1), 
  new Date(2025, 4, 1),  
  new Date(2025, 10, 1), 
  new Date(2026, 4, 1),  
];

const fmt = d3.timeFormat('%-m/%Y');

ticks.forEach(t => {
  const tx = xScale(t);
  g.append('line')
    .attr('x1', tx).attr('x2', tx)
    .attr('y1', 0).attr('y2', chartH)
    .attr('stroke', '#c8c8c8').attr('stroke-dasharray', '2,3');
  g.append('text')
    .attr('x', tx).attr('y', -10)
    .attr('text-anchor', 'middle')
    .attr('font-size', isMobile ? 11 : 13)
    .attr('fill', '#494949')
    .text(fmt(t));
});

const partidoColors = { Vox: '#8bc34a', UPN: '#1a3a5c', exPP: '#2c4a6e' };

people.forEach((p, i) => {
  const y0 = rowY(i);

  if (p.id === 'landaluce') {
     let startX = xScale(new Date(2025, 11, 1));
     g.append('rect')
       .attr('x', startX).attr('y', y0)
       .attr('width', w - startX).attr('height', rowH)
       .attr('fill', 'url(#stripes)');
  } else if (p.id === 'alonso') {
     let startX = xScale(new Date(2026, 4, 20));
     g.append('rect')
       .attr('x', startX).attr('y', y0)
       .attr('width', w - startX).attr('height', rowH)
       .attr('fill', 'url(#stripes)');
  } else if (p.id === 'gordillo') {
     let endX1 = xScale(new Date(2026, 1, 1));
     g.append('rect')
       .attr('x', 0).attr('y', y0)
       .attr('width', endX1).attr('height', rowH)
       .attr('fill', 'url(#stripes)');

     let startX2 = xScale(new Date(2026, 4, 1));
     g.append('rect')
       .attr('x', startX2).attr('y', y0)
       .attr('width', w - startX2).attr('height', rowH)
       .attr('fill', 'url(#stripes)');
  } else {
     g.append('rect')
       .attr('x', 0).attr('y', y0)
       .attr('width', w).attr('height', rowH)
       .attr('fill', 'url(#stripes)');
  }

  const lines = p.name.split('\n');
  const labelG = g.append('text')
    .attr('text-anchor', 'end')
    .attr('dominant-baseline', 'central')
    .attr('font-weight', 500)
    .attr('font-size', isMobile ? 11 : 14) // Fuente de nombre adaptada
    .attr('fill', '#1a1a1a');

  lines.forEach((line, li) => {
    labelG.append('tspan')
      .attr('x', -8) // Acercamos los nombres ligeramente a las barras
      .attr('y', y0 + rowH / 2 + (li - (lines.length - 1) / 2) * (isMobile ? 11 : 13))
      .text(line);
  });
});

// ── PARTIDO BRACKETS ──
function drawBracket(ids, label, color) {
  const indices = ids.map(id => people.findIndex(p => p.id === id));
  const y1 = rowY(Math.min(...indices));
  const y2 = rowY(Math.max(...indices)) + rowH;
  
  // Posiciones adaptadas para el bracket lateral
  const lineX = isMobile ? -62 : -87;
  const textX = isMobile ? -67 : -97;
  const fontSize = isMobile ? 12 : 17;

  g.append('line')
    .attr('x1', lineX).attr('x2', lineX)
    .attr('y1', y1).attr('y2', y2)
    .attr('stroke', color).attr('stroke-width', 3);
    
  g.append('text')
    .attr('x', textX).attr('y', (y1 + y2) / 2)
    .attr('text-anchor', 'end').attr('dominant-baseline', 'central')
    .attr('font-weight', 800)
    .attr('font-size', fontSize)
    .attr('fill', color)
    .text(label);
}

drawBracket(['paloma', 'gordillo', 'carbonell', 'alonso'], 'Vox', partidoColors.Vox);
drawBracket(['caballero'], 'UPN', partidoColors.UPN);
drawBracket(['landaluce'], 'exPP', partidoColors.exPP);

// ── BARS Y TOOLTIP ──
const tooltip = d3.select('#tooltip');

function fmtDate(d) {
  const dia = String(d.getDate()).padStart(2, '0');
  const mes = String(d.getMonth() + 1).padStart(2, '0');
  const anio = d.getFullYear();
  return `${dia}/${mes}/${anio}`;
}

function personRow(pid) {
  return people.findIndex(p => p.id === pid);
}

g.selectAll('.bar')
  .data(slots)
  .join('rect')
  .attr('class', 'bar')
  .attr('x', d => xScale(d.start))
  .attr('y', d => rowY(personRow(d.person)))
  .attr('width', d => Math.max(2, xScale(d.end) - xScale(d.start)))
  .attr('height', rowH)
  .attr('fill', d => d.role === 'Portavoz' ? '#01f3b3' : '#b8b8b8')
  .on('mouseenter', function (ev, d) {
    const p = people.find(pp => pp.id === d.person);
    const rc = d.role === 'Portavoz' ? 'portavoz' : 'adjunto';
    const pColor = partidoColors[p.partido] || '#999';
    
    tooltip.html(`
      <div class="tt-name">${p.fullName}</div>
      <span class="tt-badge ${rc}">${d.role}</span>
      <div class="tt-dates">${fmtDate(d.start)} — ${fmtDate(d.end)}</div>
      <div class="tt-partido" style="color: ${pColor}; font-weight: 700;">${p.partido}</div>
    `).style('opacity', 1);
    pos(ev);
  })
  .on('mousemove', pos)
  .on('mouseleave', () => tooltip.style('opacity', 0));

function pos(ev) {
  const n = tooltip.node();
  let l = ev.clientX + 14, t = ev.clientY - n.offsetHeight / 2;
  if (l + n.offsetWidth > innerWidth - 10) l = ev.clientX - n.offsetWidth - 14;
  if (t < 4) t = 4;
  if (t + n.offsetHeight > innerHeight - 4) t = innerHeight - n.offsetHeight - 4;
  tooltip.style('left', l + 'px').style('top', t + 'px');
}

// ── ANNOTATIONS ESPECÍFICAS ──

// Para los textos en el propio gráfico, utilizamos textos más cortos en móviles para evitar reboses.
const landI = personRow('landaluce');
const arrowX = xScale(new Date(2025, 11, 1));  
g.append('text')
  .attr('x', arrowX - (isMobile ? 3 : 5))
  .attr('y', rowY(landI) + rowH / 2 - 2)
  .attr('text-anchor', 'end')
  .attr('dominant-baseline', 'central')
  .attr('font-size', isMobile ? 9 : 12)
  .attr('fill', '#494949')
  .attr('font-style', 'italic')
  .text(isMobile ? 'Pasa al Grupo Mixto →' : 'Pasa al Grupo Mixto en diciembre →');

const alonsoI = personRow('alonso');
const senadorX = xScale(new Date(2026, 4, 20));
g.append('text')
  .attr('x', senadorX - (isMobile ? 3 : 6))
  .attr('y', rowY(alonsoI) + rowH / 2 - 2)
  .attr('text-anchor', 'end')
  .attr('dominant-baseline', 'central')
  .attr('font-size', isMobile ? 9 : 12)
  .attr('fill', '#494949')
  .attr('font-style', 'italic')
  .text(isMobile ? 'Senador desde el 20/05 →' : 'Senador desde el 20 de mayo →');


// Inicializa pym.js en el hijo para enviar la altura real a la página padre
if (typeof pym !== 'undefined') {
  var pymChild = new pym.Child({ polling: 500 }); // Comprueba la altura cada 500ms
  pymChild.sendHeight();
} else {
  // Por si acaso la librería tarda en cargar en GitHub, lo reintentamos al cargar la ventana
  window.addEventListener('load', () => {
    if (window.pym) {
      var pymChild = new pym.Child({ polling: 500 });
      pymChild.sendHeight();
    }
  });
}

</script>
</body>
</html>
